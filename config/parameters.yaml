# Configuración General del Proyecto
project:
  name: "Tesis Heladas Tardías"
  author: "Federico Saurin"
  version: "1.0.0"

# Rutas de Archivos (Ajustadas para la estructura de carpetas del contenedor)
paths:
  raw_data: "data/raw/dataframe.txt"
  processed_output: "data/processed/dataframe_procesado.csv"
  figures_dir: "reports/figures"
  raw_results_dir: "reports/raw_results"
  results_csv: "reports/results_metrics.csv"

# Parámetros de Procesamiento
preprocessing:
  months_to_keep: [6, 7, 8, 9]  # Temporada de heladas: Jun, Jul, Ago, Sep
  knn_neighbors: 1
  station_type: "regina"
  # Columnas a eliminar manualmente si fuera necesario
  columns_to_drop: ['dia', 'mes', 'anio'] 

# Parámetros del Modelo ANN
model:
  target_column: 'LowTemp'
  n_hours: 24              # Lead times (0 a 23 horas de antelación)
  records_per_hour: 6      # Cada registro representa 10 minutos
  n_splits: 5              # Validación cruzada (StratifiedKFold)
  random_state: 42
  
  # Arquitecturas: Se probarán una tras otra automáticamente
  architectures:
    - [32]
    - [64]
    - [32, 16]
  
  hyperparameters:
    alpha: 0.0001
    max_iter: 1000